<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#b5121b">
<title>Monopoly Mayhem Soundboard</title>
<style>
:root{--ink:#241d20;--paper:#fff8e9}
*{box-sizing:border-box}
body{margin:0;background:linear-gradient(160deg,#fff8e9,#f6e8c9);color:var(--ink);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
header{background:#c91522;color:white;text-align:center;padding:22px 16px 18px;border-bottom:5px solid #8c0b14;box-shadow:0 4px 0 #e9b84c}
header .eyebrow{font-size:.75rem;font-weight:900;letter-spacing:.18em;text-transform:uppercase}
h1{font-size:clamp(1.8rem,8vw,2.6rem);line-height:1;margin:7px 0}
header p{margin:8px 0 0;font-weight:650;font-size:.92rem}
main{max-width:720px;margin:auto;padding:16px 13px 30px}
.tip{background:#fff;border:2px solid #ead7ad;border-radius:14px;padding:11px 13px;font-size:.88rem;margin-bottom:14px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}
button.sound{border:0;border-radius:18px;min-height:116px;padding:13px 8px;color:white;font:inherit;font-weight:900;box-shadow:0 5px 0 rgba(0,0,0,.2),inset 0 2px 0 rgba(255,255,255,.4);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;cursor:pointer;touch-action:manipulation;transition:transform .08s,filter .08s}
button.sound:active{transform:translateY(4px);box-shadow:0 1px 0 rgba(0,0,0,.2);filter:brightness(1.1)}
.emoji{font-size:2.15rem;line-height:1.15}
.name{font-size:1.03rem;line-height:1.15}
.sub{font-size:.72rem;font-weight:650;opacity:.92}
.red{background:#e52b35}.green{background:#14a94a}.blue{background:#147ce5}.orange{background:#f07813}.purple{background:#7838c9}.gold{background:#e7ad00;color:#302000!important}.teal{background:#079aab}.pink{background:#e44c91}.dark{background:#38363b}.lime{background:#5c9d20}
footer{text-align:center;padding:15px 5px;color:#695b4b;font-size:.78rem}
#status{font-weight:800;text-align:center;margin:14px 0 0;min-height:1.4em}
.controls{display:flex;justify-content:center;margin-top:12px}
.smallbtn{background:#fff;border:2px solid #ddc99d;border-radius:999px;padding:10px 17px;font-weight:800;color:#493b2b}
@media(min-width:560px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}button.sound{min-height:125px}}
</style>
</head>
<body>
<header><div class="eyebrow">The totally unofficial</div><h1>MONOPOLY MAYHEM</h1><p>Tap a button. Ruin a friendship. 🎲</p></header>
<main>
<div class="tip">🔊 <b>Sound on!</b> Turn up your iPhone volume, then tap a big button. If audio is blocked, tap once more.</div>
<div class="grid">
<button class="sound green" data-sound="dice"><span class="emoji">🎲</span><span class="name">Dice Roll</span><span class="sub">Rattle, rattle, clack!</span></button>
<button class="sound blue" data-sound="collect"><span class="emoji">💷</span><span class="name">Collect £200</span><span class="sub">Cha-ching!</span></button>
<button class="sound red" data-sound="buy"><span class="emoji">🏠</span><span class="name">Buy Property</span><span class="sub">Mine! All mine!</span></button>
<button class="sound orange" data-sound="rent"><span class="emoji">💸</span><span class="name">Pay Rent</span><span class="sub">Wallet pain</span></button>
<button class="sound purple" data-sound="jail"><span class="emoji">🚔</span><span class="name">Go to Jail</span><span class="sub">You have been got!</span></button>
<button class="sound gold" data-sound="chance"><span class="emoji">❓</span><span class="name">Chance Card</span><span class="sub">Uh-oh… maybe?</span></button>
<button class="sound teal" data-sound="chest"><span class="emoji">🧰</span><span class="name">Community Chest</span><span class="sub">A surprise!</span></button>
<button class="sound dark" data-sound="auction"><span class="emoji">🔨</span><span class="name">Auction</span><span class="sub">Going once… twice…</span></button>
<button class="sound pink" data-sound="bankrupt"><span class="emoji">📉</span><span class="name">Bankrupt</span><span class="sub">Financial oof</span></button>
<button class="sound lime" data-sound="win"><span class="emoji">🏆</span><span class="name">WINNER!</span><span class="sub">Gloat responsibly</span></button>
</div>
<div id="status" aria-live="polite">Ready when you are…</div>
<div class="controls"><button class="smallbtn" id="stop">■ Stop sounds</button></div>
<footer>Best played at full volume. Apologies to your neighbours.</footer>
</main>
<script>
let ctx = null;
let activeNodes = [];
function getAudio() {
  if (!ctx || ctx.state === 'closed') {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) throw new Error('Web Audio is not supported.');
    ctx = new AC();
  }
  if (ctx.state !== 'running') ctx.resume();
  return ctx;
}
function tone(freq, start, dur, type='sine', vol=.12, endFreq=null, pan=0) {
  const c=getAudio(), o=c.createOscillator(), g=c.createGain(), p=c.createStereoPanner ? c.createStereoPanner() : null;
  o.type=type; o.frequency.setValueAtTime(Math.max(1,freq),start);
  if(endFreq!==null) o.frequency.exponentialRampToValueAtTime(Math.max(1,endFreq),start+dur);
  g.gain.setValueAtTime(.0001,start); g.gain.exponentialRampToValueAtTime(vol,start+.012);
  g.gain.exponentialRampToValueAtTime(.0001,start+dur);
  o.connect(g);
  if(p){p.pan.value=pan;g.connect(p);p.connect(c.destination)}else g.connect(c.destination);
  o.start(start);o.stop(start+dur+.025);activeNodes.push(o);
}
function noise(start,dur,vol=.1,cut=1800,pan=0){
  const c=getAudio(), len=Math.max(1,Math.floor(c.sampleRate*dur)), b=c.createBuffer(1,len,c.sampleRate), d=b.getChannelData(0);
  for(let i=0;i<len;i++) d[i]=(Math.random()*2-1)*(1-i/len*.25);
  const s=c.createBufferSource(),f=c.createBiquadFilter(),g=c.createGain(),p=c.createStereoPanner?c.createStereoPanner():null;
  s.buffer=b;f.type='lowpass';f.frequency.value=cut;g.gain.setValueAtTime(vol,start);g.gain.exponentialRampToValueAtTime(.0001,start+dur);
  s.connect(f);f.connect(g);if(p){p.pan.value=pan;g.connect(p);p.connect(c.destination)}else g.connect(c.destination);
  s.start(start);s.stop(start+dur);activeNodes.push(s);
}
function chord(notes,t,dur=.32,vol=.07){notes.forEach((n,i)=>tone(n,t,dur,'triangle',vol,null,(i-(notes.length-1)/2)*.15))}
function coin(t, pitch=1){tone(1450*pitch,t,.075,'sine',.09,2050*pitch,.15);tone(2200*pitch,t+.045,.11,'sine',.07,1250*pitch,-.15)}
function click(t){noise(t,.045,.1,2600);tone(210,t,.055,'square',.045,95)}
function play(kind){
  const c=getAudio(), t=c.currentTime+.025;
  if(kind==='dice'){
    // Two dice tumbling, rattling, then settling on the table
    for(let i=0;i<13;i++){const at=t+i*.055;noise(at,.05,.08,3000,Math.sin(i)*.65);tone(180+Math.random()*380,at,.045,'triangle',.045,100+Math.random()*90)}
    noise(t+.73,.16,.11,1200);tone(115,t+.76,.13,'triangle',.08,65);
  } else if(kind==='collect'){
    // Cash register / bank payout with a bright success flourish
    tone(1050,t,.07,'square',.035,780);tone(1500,t+.07,.07,'square',.04,1100);
    for(let i=0;i<5;i++)coin(t+.16+i*.105,1-i*.045);
    chord([523,659,784,1047],t+.67,.5,.055);
  } else if(kind==='buy'){
    // Firm purchase stamp, then a short triumphant property jingle
    click(t);tone(90,t+.04,.13,'sine',.16,48);coin(t+.18,.8);
    [392,494,587,784,988].forEach((n,i)=>tone(n,t+.34+i*.105,.16,'triangle',.075));
    chord([587,740,988],t+.92,.42,.06);
  } else if(kind==='rent'){
    // Coins leaving your pocket, with a lower, rueful sting
    for(let i=0;i<4;i++)coin(t+i*.13,1.05-i*.12);
    tone(330,t+.55,.28,'sawtooth',.07,220);tone(220,t+.82,.42,'triangle',.09,110);
    noise(t+.91,.2,.055,700);
  } else if(kind==='jail'){
    // Heavy gate slam and metallic rattle
    tone(95,t,.38,'sine',.2,42);noise(t+.02,.22,.18,650);noise(t+.23,.16,.12,2100);
    tone(680,t+.28,.12,'square',.055,420);tone(510,t+.43,.12,'square',.05,310);
    tone(155,t+.62,.55,'sine',.13,72);noise(t+.65,.3,.055,900);
  } else if(kind==='chance'){
    // Mysterious card flip, sparkle and a slightly suspenseful flourish
    noise(t,.12,.07,3200);noise(t+.12,.13,.06,2200);
    tone(440,t+.18,.19,'sine',.06,660);tone(554,t+.35,.2,'sine',.07,831);
    tone(659,t+.54,.38,'triangle',.07,988);tone(988,t+.72,.48,'sine',.045,740);
  } else if(kind==='chest'){
    // Wooden chest opening with coins spilling out
    noise(t,.12,.13,850);tone(130,t+.04,.23,'triangle',.12,260);
    noise(t+.2,.2,.09,2600);
    for(let i=0;i<6;i++)coin(t+.27+i*.09,.8+Math.random()*.3);
    chord([523,659,784],t+.83,.4,.05);
  } else if(kind==='auction'){
    // Gavel taps, accelerating bids, then the final bang
    for(let i=0;i<3;i++){const at=t+i*.24; tone(155,at,.09,'sine',.12,75);noise(at,.06,.12,500);tone(650,at+.02,.04,'square',.035,400)}
    tone(120,t+.82,.22,'sine',.2,48);noise(t+.82,.16,.17,600);
    chord([392,494,587],t+1.05,.35,.045);
  } else if(kind==='bankrupt'){
    // Deflating buzz and descending comic defeat
    tone(240,t,.75,'sawtooth',.08,55);tone(120,t+.05,.85,'square',.045,35);
    [392,330,262,196,147,98].forEach((n,i)=>tone(n,t+.18+i*.16,.22,'triangle',.07,n*.72));
    noise(t+1.12,.4,.07,550);
  } else if(kind==='win'){
    // Big celebratory fanfare with bell-like notes and sparkling finish
    chord([392,494,587],t,.32,.055);
    [523,659,784,1047,784,1047,1319,1568].forEach((n,i)=>tone(n,t+.25+i*.14,.24,'triangle',.075));
    chord([784,988,1175,1568],t+1.48,.75,.055);
    for(let i=0;i<7;i++)coin(t+1.45+i*.075,1+Math.random()*.2);
  }
  const labels={dice:'🎲 Dice rolling!',collect:'💷 Bank payout!',buy:'🏠 Property purchased!',rent:'💸 Rent paid!',jail:'🚔 Sent to jail!',chance:'❓ Chance card!',chest:'🧰 Community Chest!',auction:'🔨 Going once… SOLD!',bankrupt:'📉 Bankrupt!',win:'🏆 MONOPOLY WINNER!'};
  const status=document.getElementById('status'); if(status)status.textContent=labels[kind]||'Playing sound…';
}
document.querySelectorAll('[data-sound]').forEach(button=>button.addEventListener('click',()=>{
  try{play(button.dataset.sound)}catch(e){console.error(e);const s=document.getElementById('status');if(s)s.textContent='Audio error: '+e.message}
}));
const stop=document.getElementById('stop');
if(stop)stop.addEventListener('click',()=>{if(ctx&&ctx.state!=='closed'){activeNodes.forEach(n=>{try{n.stop()}catch(e){}});ctx.close()}ctx=null;activeNodes=[];const s=document.getElementById('status');if(s)s.textContent='Silence… for now. 🤫'});
</script>
</body>
</html>
